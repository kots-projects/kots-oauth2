---
services:
  oauth2:
    build: .
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 3s
      retries: 12
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_PASSWORD: oauth2
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
